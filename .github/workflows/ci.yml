name: CI

# Gate obrigatório antes de merge: typecheck + lint (escopo mantido) + testes unitários.
# Torna verificável a qualidade do código NOVO sem depender do build ignorar lint.
# (Lint repo-wide tem débito pré-existente em outros módulos — cleanup é tarefa à parte.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # A RAIZ DESTE REPO JÁ É `apps/web` (o monorepo mora na pasta-mãe, fora do git).
    # Por isso não há `working-directory: apps/web` nem prefixo `apps/web/` nos caminhos:
    # esse era o motivo do job falhar em ~10s em toda run desde 2026-07-14, sem nunca
    # chegar a rodar typecheck/lint/testes.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint:whatsapp
      - run: npm test
